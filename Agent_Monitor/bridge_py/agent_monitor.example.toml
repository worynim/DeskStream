# Agent_Monitor 사용자 설정 예시
# 설치: python3 agent_bridge.py init-config   →  ~/.deskstream/agent_monitor.toml (권한 600)
# 고치면 바로 반영되므로 데몬을 재시작할 필요가 없습니다.

# 장치 설정
[device]
mute = false        # true = 알림음·버튼음 모두 끔
brightness = 40     # OLED 밝기 % (1~100) — 낮출수록 번인(잔상)이 줄어듭니다

# 버튼 길게 누르기(1초) → PC 명령. button = 1~4 (BTN1~BTN4)
# type = "focus" : app 을 앞으로
# type = "shell" : command 실행 (cwd, timeout 초 선택) → 장치에 exit 코드 표시
# type = "keys"  : text 입력 후 key 누름 (app 지정 시 그 앱을 먼저 앞으로)
#                  key = return | escape | tab | space | ctrl+c, text 는 ASCII 만
#                  macOS 시스템 설정 > 개인정보 보호 및 보안 > 손쉬운 사용 에서 터미널(데몬을 실행한 앱) 허용 필요

[[commands]]
button = 1
label = "Terminal"
type = "focus"
app = "Terminal"

[[commands]]
button = 2
label = "Downloads"
type = "shell"
command = "open ~/Downloads"      # 예: 프로젝트 테스트라면 command = "npm test", cwd = "~/work/my-app"
timeout = 30

[[commands]]
button = 3
label = "Continue"
type = "keys"
app = "Terminal"
text = "continue"
key = "return"

[[commands]]
button = 4
label = "Esc"
type = "keys"
app = "Terminal"
key = "escape"
